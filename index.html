<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>POP 瑶瑶隐藏款</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=ZCOOL+KuaiLe&display=swap">
<style>
:root{--milk:#FFF5F8;--berry:#FF5E9A;--berry-deep:#E0407D;--ink:#4A2246;--ink-soft:#8C5C86;--line:#F3D3E0;--display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;--round:"Fredoka","PingFang SC",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--milk);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background-image:radial-gradient(circle at 1px 1px,rgba(255,94,154,.14) 1.2px,transparent 1.6px);background-size:22px 22px}
.box{position:relative;width:min(360px,100%);background:#fff;border:3px solid var(--line);border-radius:30px;padding:30px 24px 26px;text-align:center;box-shadow:0 10px 0 -2px rgba(74,34,70,.08),0 24px 50px -22px rgba(224,64,125,.45);animation:in .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes in{from{transform:translateY(30px) scale(.9);opacity:0}}
.pals{display:flex;justify-content:center;gap:0;margin:-74px auto 6px;height:96px}
.pals svg{width:84px;height:auto;animation:bob 2.6s ease-in-out infinite}
.pals svg+svg{animation-delay:.4s;margin-left:-14px}
@keyframes bob{50%{transform:translateY(-7px) rotate(3deg)}}
h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0;color:var(--berry)}
p{margin:6px 0 0;color:var(--ink-soft);font-size:14px}
form{margin-top:22px;display:flex;flex-direction:column;gap:12px}
label{font-size:13px;color:var(--ink-soft);text-align:left}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--milk);color:var(--ink);outline:none;transition:border-color .2s}
input[type=password]:focus{border-color:var(--berry)}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);justify-content:flex-start}
button{border:none;border-radius:999px;padding:12px 20px;font-family:var(--display);font-size:20px;background:var(--berry);color:#fff;box-shadow:0 6px 0 var(--berry-deep);cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--berry-deep)}
button:disabled{opacity:.7;cursor:progress}
.msg{min-height:1.4em;font-size:14px;color:var(--berry-deep)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
input[type=checkbox]{accent-color:var(--berry)}
p{text-wrap:balance}
:focus-visible{outline:3px dashed var(--berry);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="box" id="box">
  <div class="pals" aria-hidden="true">
    <svg viewBox="0 0 120 132"><path d="M82 112 C108 114 118 86 104 66 C100 88 92 96 78 100 Z" fill="#FF8A3D"/><path d="M104 66 C114 76 114 90 109 98 C103 90 100 80 104 66 Z" fill="#FFF3E3"/><ellipse cx="60" cy="112" rx="28" ry="19" fill="#FF8A3D"/><ellipse cx="60" cy="116" rx="16" ry="12" fill="#FFF3E3"/><ellipse cx="45" cy="126" rx="9" ry="5.5" fill="#7A3E2A"/><ellipse cx="75" cy="126" rx="9" ry="5.5" fill="#7A3E2A"/><path d="M22 44 L30 6 L54 28 Z" fill="#FF8A3D" stroke="#FF8A3D" stroke-width="8" stroke-linejoin="round"/><path d="M98 44 L90 6 L66 28 Z" fill="#FF8A3D" stroke="#FF8A3D" stroke-width="8" stroke-linejoin="round"/><path d="M30 36 L33 16 L46 28 Z" fill="#FFD1C0"/><path d="M90 36 L87 16 L74 28 Z" fill="#FFD1C0"/><ellipse cx="60" cy="58" rx="41" ry="34" fill="#FF8A3D"/><path d="M20 60 C28 94 92 94 100 60 C90 70 74 66 60 76 C46 66 30 70 20 60 Z" fill="#FFF3E3"/><circle cx="44" cy="54" r="5.4" fill="#4A2246"/><circle cx="76" cy="54" r="5.4" fill="#4A2246"/><circle cx="45.8" cy="52" r="1.9" fill="#fff"/><circle cx="77.8" cy="52" r="1.9" fill="#fff"/><ellipse cx="60" cy="72" rx="5.5" ry="4" fill="#4A2246"/><path d="M55 78 q5 4 10 0" stroke="#4A2246" stroke-width="2.4" fill="none" stroke-linecap="round"/><ellipse cx="33" cy="68" rx="6.5" ry="4" fill="#FF8FB4" opacity=".8"/><ellipse cx="87" cy="68" rx="6.5" ry="4" fill="#FF8FB4" opacity=".8"/></svg>
    <svg viewBox="0 0 120 132"><ellipse cx="60" cy="112" rx="30" ry="19" fill="#FFFFFF" stroke="#EAD8E8" stroke-width="2.5"/><ellipse cx="45" cy="125" rx="8" ry="5.5" fill="#F7D7C4"/><ellipse cx="75" cy="125" rx="8" ry="5.5" fill="#F7D7C4"/><g fill="#FFFFFF" stroke="#EAD8E8" stroke-width="2.5"><circle cx="30" cy="40" r="16"/><circle cx="48" cy="24" r="16"/><circle cx="72" cy="24" r="16"/><circle cx="90" cy="40" r="16"/><circle cx="96" cy="62" r="14"/><circle cx="24" cy="62" r="14"/><circle cx="34" cy="82" r="13"/><circle cx="86" cy="82" r="13"/></g><circle cx="60" cy="56" r="36" fill="#fff"/><circle cx="27" cy="46" r="10" fill="#F6CBAA"/><circle cx="27" cy="46" r="5" fill="#E8AE88"/><circle cx="93" cy="46" r="10" fill="#F6CBAA"/><circle cx="93" cy="46" r="5" fill="#E8AE88"/><ellipse cx="60" cy="66" rx="25" ry="23" fill="#FFF1E8"/><circle cx="49" cy="62" r="5" fill="#4A2246"/><circle cx="71" cy="62" r="5" fill="#4A2246"/><circle cx="50.6" cy="60" r="1.8" fill="#fff"/><circle cx="72.6" cy="60" r="1.8" fill="#fff"/><path d="M54 74 q3 3 6 0 q3 3 6 0" stroke="#4A2246" stroke-width="2.4" fill="none" stroke-linecap="round"/><ellipse cx="41" cy="73" rx="6" ry="4" fill="#FF8FB4" opacity=".8"/><ellipse cx="79" cy="73" rx="6" ry="4" fill="#FF8FB4" opacity=".8"/><g transform="translate(80 18) rotate(18)"><path d="M0 0 l-12 -8 v16z M0 0 l12 -8 v16z" fill="#FF5E9A"/><circle r="4" fill="#E0407D"/></g></svg>
  </div>
  <h1>瑶瑶的盲盒</h1>
  <p>这是一份只给老婆的隐藏款，输入密码才能拆开。</p>
  <form id="f" autocomplete="off">
    <label for="pw">密码</label>
    <input id="pw" type="password" required autofocus>
    <label class="remember"><input id="rm" type="checkbox" checked> 在这台设备上记住我</label>
    <button id="go" type="submit">拆开盲盒</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
(function(){
const ITER=250000;
const $=id=>document.getElementById(id);
const msg=t=>{$('msg').textContent=t};
let payload=null;
async function load(){if(!payload){const r=await fetch('payload.bin',{cache:'no-cache'});if(!r.ok)throw new Error('load');payload=new Uint8Array(await r.arrayBuffer())}return payload}
async function keyFrom(pw,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,256))}
async function dec(raw){const p=await load();const salt=p.slice(0,16),iv=p.slice(16,28),ct=p.slice(28);
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  const html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return html}
function show(html){document.open();document.write(html);document.close()}
const b64=u=>btoa(String.fromCharCode(...u)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let saved=null;try{saved=localStorage.getItem('yy_gate')}catch(e){}
if(saved){msg('正在拆开…');$('go').disabled=true;dec(unb64(saved)).then(show).catch(()=>{try{localStorage.removeItem('yy_gate')}catch(e){}msg('');$('go').disabled=false})}
$('f').addEventListener('submit',async e=>{e.preventDefault();const pw=$('pw').value;if(!pw)return;$('go').disabled=true;msg('正在拆开…');
  try{const p=await load();const raw=await keyFrom(pw,p.slice(0,16));const html=await dec(raw);
    if($('rm').checked){try{localStorage.setItem('yy_gate',b64(raw))}catch(e){}}
    show(html)}
  catch(err){$('go').disabled=false;msg(err&&err.message==='load'?'加载失败了，刷新再试一次':'密码不对哦，再想想～');const box=$('box');box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');$('pw').select()}});
})();
</script>
</body>
</html>
